name: ci

on:
  push:
    branches: [main]
    paths: &ci_paths
      - 'apps/**'
      - 'packages/**'
      - 'services/**'
      - 'examples/**'
      - 'deploy/**'
      - 'data/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig*.json'
      - 'vitest.config.*'
      - 'eslint.config.*'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/ci.yml'
  pull_request:
    paths: *ci_paths

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.18.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.8.2
          enable-cache: true
          cache-dependency-glob: services/optimizer/uv.lock
      - name: Install
        run: |
          bun install --frozen-lockfile
          cd services/optimizer && uv sync --locked
      - name: Optimizer lint and tests
        working-directory: services/optimizer
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest
      - name: Contracts are current
        run: |
          bun run contracts:generate
          git diff --exit-code packages/contracts
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
