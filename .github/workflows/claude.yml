# Added by proj (Set up agents). Runs Claude Code when timblazing mentions @claude.
# The job lives in timblazing/skills/.github/workflows/claude-agent.yml; proj sets the CLAUDE_* repo variables.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    uses: timblazing/skills/.github/workflows/claude-agent.yml@main
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    with:
      runner: ${{ vars.CLAUDE_RUNNER }}
      model: ${{ vars.CLAUDE_MODEL }}
      effort: ${{ vars.CLAUDE_EFFORT }}
      timeout-minutes: ${{ vars.CLAUDE_TIMEOUT_MINUTES }}
      skills-repo: ${{ vars.CLAUDE_SKILLS_REPO }}
      skills-ref: ${{ vars.CLAUDE_SKILLS_REF }}
    secrets: inherit
