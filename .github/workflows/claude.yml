# Added by proj (Set up agents). Runs Claude Code when timblazing mentions @claude.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      github.event.sender.login == 'timblazing' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ${{ vars.CLAUDE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    env:
      CLAUDE_CODE_SUBAGENT_MODEL: sonnet
      ENABLE_TOOL_SEARCH: 'true'
      BASH_MAX_OUTPUT_LENGTH: '30000'
      CLAUDE_AUTOCOMPACT_PCT_OVERRIDE: '75'
      CLAUDE_CODE_DISABLE_AUTO_MEMORY: '1'
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Links the skills into ~/.claude/skills and ~/.agents/skills. Pulls instead of cloning when
      # HOME already has them (a persistent self-hosted runner; anton-jit jobs get a fresh HOME).
      - name: Install skills
        run: |
          if [ -d "$HOME/skills/.git" ]; then git -C "$HOME/skills" pull --ff-only; else git clone --depth 1 https://github.com/timblazing/skills "$HOME/skills"; fi
          "$HOME/skills/install.sh"

      # pnpm/yarn ship through corepack; ubuntu-latest has Node but not pnpm on PATH.
      - name: Enable corepack
        run: corepack enable || true

      # Tailnet-only MCP: probe from this runner, never add an unreachable server.
      - name: Configure available MCP servers
        id: proj
        shell: bash
        run: |
          config='{"mcpServers":{}}'
          if curl --fail --silent --max-time 5 https://proj.blasingame.dev/api/health >/dev/null; then
            config=$(printf '%s' "$config" | jq -c '.mcpServers.proj = {type:"http",url:"https://proj.blasingame.dev/api/mcp"}')
          fi
          printf "args=--mcp-config '%s'\n" "$config" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --model claude-opus-5-5 --effort medium
            --permission-mode bypassPermissions
            ${{ steps.proj.outputs.args }}
