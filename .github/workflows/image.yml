name: image

# Publishes the multi-arch image to GHCR on version tags (or manual dispatch), then checks
# that the amd64 image starts and answers /api/health.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.sha }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/fillrate

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: meta
        run: |
          tags="$IMAGE:sha-${GITHUB_SHA::7}"$'\n'"$IMAGE:latest"
          if [ "$GITHUB_REF_TYPE" = tag ]; then tags+=$'\n'"$IMAGE:${GITHUB_REF_NAME#v}"; fi
          { echo 'tags<<EOF'; echo "$tags"; echo EOF; } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (amd64)
        run: |
          docker run -d --name fillrate -p 127.0.0.1:3000:3000 \
            --platform linux/amd64 "$IMAGE:sha-${GITHUB_SHA::7}"
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then echo healthy; exit 0; fi
            sleep 2
          done
          docker logs fillrate
          exit 1
