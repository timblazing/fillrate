[project]
name = "fillrate-optimizer"
version = "0.1.0"
description = "Fillrate optimizer service: allocation, clustering, and PyVRP load building"
requires-python = "==3.13.*"
dependencies = [
  "pyvrp==0.14.0",
  "ortools==9.15.6755",
  "scikit-learn==1.9.1",
  "numpy==2.5.3",
  "h3==4.5.0",
  "fastapi==0.142.2",
  "pydantic==2.13.5",
  "uvicorn==0.54.0",
]

[project.scripts]
fillrate-optimizer = "fillrate_optimizer.app:main"

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "httpx2==2.13.1",
  "ruff==0.16.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fillrate_optimizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
